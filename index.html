<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8fd63f">
  <title>Crea la tua squadra Pokemon: Generatore e Confronto</title>
  <meta name="description" content="Genera la tua squadra pokemon in modo immediato: scegli le abilità, gli oggetti e modifica le stat. Cura la tua squadra in ogni dettaglio.">
  <link rel="canonical" href="https://marcofonico.github.io/squadra-pokemon/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="it_IT">
  <meta property="og:url" content="https://marcofonico.github.io/squadra-pokemon/">
  <meta property="og:title" content="Crea la tua squadra Pokemon: Generatore e Confronto">
  <meta property="og:description" content="Genera la tua squadra pokemon in modo immediato: scegli le abilità, gli oggetti e modifica le stat. Cura la tua squadra in ogni dettaglio.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Crea la tua squadra Pokemon: Generatore e Confronto">
  <meta name="twitter:description" content="Genera la tua squadra pokemon in modo immediato: scegli le abilità, gli oggetti e modifica le stat. Cura la tua squadra in ogni dettaglio.">
  <link rel="icon" href="assets/icons/25.png">
  <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
  <div class="app" id="app">

    <!-- Sidebar: ricerca, generazioni, giochi -->
    <aside class="sidebar" id="filters" aria-label="Filtri">
      <button class="drawer-close" data-action="close-filters" aria-label="Chiudi filtri">✕</button>
      <h1 class="site-title">Crea la tua squadra pokemon</h1>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <input id="search" type="search" placeholder="Cerca Pokémon…" autocomplete="off" spellcheck="false">
      </label>

      <section>
        <h2 class="side-title">Gen.</h2>
        <div class="gen-grid" id="genGrid"></div>
      </section>

      <section>
        <h2 class="side-title">Giochi</h2>
        <ul class="games" id="games"></ul>
        <p class="side-note">Elenco in base alla generazione. Per ora è disponibile solo l'ottava.</p>
      </section>
    </aside>

    <!-- Centro -->
    <main class="main" id="main">
      <nav class="navbar" aria-label="Sezioni">
        <div class="tabs" role="group">
          <button class="tab" data-action="mode" data-mode="build" aria-pressed="true">Costruttore</button>
          <button class="tab" data-action="mode" data-mode="compare" aria-pressed="false">Squadre e confronto</button>
        </div>
        <div class="teamsw" id="teamSw">
          <select id="teamSel" class="select" aria-label="Squadra salvata"></select>
          <button class="pill ghost sm" data-action="new-team">+ Nuova</button>
        </div>
      </nav>

      <!-- Vista costruttore -->
      <div id="buildView" class="view">
        <header class="topbar">
          <div class="nameedit">
            <input id="teamName" class="team-name" maxlength="32" aria-label="Nome squadra" spellcheck="false" autocomplete="off">
            <small class="autosave-note" id="savedNote">✓ Salvata automaticamente</small>
          </div>
          <div class="viewswitch" role="group" aria-label="Vista copertura">
            <button class="vbtn" data-action="view" data-view="def" aria-pressed="true">
              <i class="abtn">A</i><span>Difensiva</span>
            </button>
            <button class="vbtn" data-action="view" data-view="off" aria-pressed="false">
              <i class="abtn">B</i><span>Offensiva</span>
            </button>
          </div>
        </header>

        <section class="card matrix-card" aria-live="polite">
          <div class="matrix" id="matrix"></div>
          <p class="legend" id="legend"></p>
        </section>

        <section class="team" id="team" aria-label="Squadra"></section>
      </div>

      <!-- Vista confronto -->
      <div id="compareView" class="view" hidden></div>

      <!-- Box di selezione (si apre dagli slot) -->
      <div class="box" id="box" hidden role="dialog" aria-modal="true" aria-labelledby="boxTitle">
        <div class="box-panel">
        <div class="box-head">
          <button class="pill ghost mobile-only" data-action="open-filters">Filtri</button>
          <h2 id="boxTitle">Box</h2>
          <div class="pager" id="pager">
            <button class="round" data-action="page-prev" aria-label="Pagina precedente">◀</button>
            <span id="pageLabel">1-30</span>
            <button class="round" data-action="page-next" aria-label="Pagina successiva">▶</button>
          </div>
          <button class="round close" data-action="close-box" aria-label="Chiudi box">✕</button>
        </div>
        <div class="btabs" role="group" aria-label="Elenco Pokémon">
          <button class="btab" id="btabAll" data-action="box-tab" data-tab="all" aria-pressed="true">Tutti i Pokémon</button>
          <button class="btab" id="btabSaved" data-action="box-tab" data-tab="saved" aria-pressed="false">Salvati (0)</button>
        </div>
        <label class="search box-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
          <input id="boxSearch" type="search" placeholder="Cerca Pokémon…" autocomplete="off" spellcheck="false">
        </label>
        <div class="box-grid" id="boxGrid"></div>
        <div class="box-info" id="boxInfo"></div>
        <div class="box-foot">
          <button class="pill danger" id="boxRemove" data-action="remove-slot">Rimuovi dallo slot</button>
          <span class="count" id="boxCount"></span>
        </div>
        </div>
      </div>
    </main>

    <!-- Destra: dettaglio Pokémon + sintesi squadra -->
    <aside class="detail" id="detail" aria-label="Dettaglio Pokémon"></aside>

    <!-- Barra comandi in basso (come il box di Spada/Scudo) -->
    <footer class="hintbar">
      <span><i class="abtn">A</i> Vista difensiva</span>
      <span><i class="abtn">B</i> Vista offensiva</span>
      <button class="hint-btn" data-action="clear-team"><i class="abtn">✕</i> Svuota squadra</button>
      <span class="credit">Dati e sprite: <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a></span>
    </footer>
  </div>

  <!-- Selettore con ricerca (mosse e oggetti) -->
  <div class="picker-wrap" id="picker" hidden>
    <div class="picker-back" data-action="close-picker"></div>
    <div class="picker" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
      <div class="picker-head">
        <h2 id="pickerTitle">Scegli</h2>
        <button class="round close" data-action="close-picker" aria-label="Chiudi">✕</button>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <input id="pickerSearch" type="search" placeholder="Cerca…" autocomplete="off" spellcheck="false">
      </label>
      <div class="picker-list" id="pickerList"></div>
    </div>
  </div>

  <div class="drawer-backdrop" id="backdrop" data-action="close-filters"></div>
  <div class="loading" id="loading">Caricamento Pokédex…</div>

  <script type="module" src="js/app.js?v=10"></script>
</body>
</html>
