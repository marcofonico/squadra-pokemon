name: Aggiorna dati Pokédex
# Rigenera data/*.json e assets/icons da PokéAPI (esecuzione manuale)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Scarica CSV e sprite (sparse)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/PokeAPI/pokeapi.git /tmp/pokeapi
          git -C /tmp/pokeapi sparse-checkout set data/v2/csv
          git clone --depth 1 --filter=blob:none --sparse https://github.com/PokeAPI/sprites.git /tmp/sprites
          git -C /tmp/sprites sparse-checkout set sprites/pokemon/versions/generation-viii/sword-shield/icons
      - name: Genera dati
        run: |
          node scripts/build-data.mjs /tmp/pokeapi/data/v2/csv data
          cp /tmp/sprites/sprites/pokemon/versions/generation-viii/sword-shield/icons/*.png assets/icons/
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A; git diff --cached --quiet || git commit -m "Aggiorna dati Pokédex" && git push
